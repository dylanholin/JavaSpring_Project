spring.application.name=api

# 🎯 Profil Spring actif (h2 ou mysql)
# Par défaut : h2 (base en mémoire pour le développement)
# Pour production : --spring.profiles.active=mysql
spring.profiles.active=h2

# URL du service utilisateurs (user-api)
user.service.url=http://localhost:8081

# Configuration des jeux
game.tictactoe.default-player-count=2
game.tictactoe.default-board-size=3
game.connectfour.default-player-count=2
game.connectfour.default-board-size=7
game.taquin.default-player-count=1
game.taquin.default-board-size=4

# Désactiver l'auto-configuration InMemoryUserDetailsManager (conflit avec JWT)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# JWT Configuration (même clé secrète que user-api)
jwt.secret=SquareGamesSecretKeyForJwtTokenSigningMustBe256BitsLong2024!
